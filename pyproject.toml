[project]
name = "foragers-world-rl"
version = "0.1.0"
description = "A JAX grid-world where foragers eat, breed and evolve, controlled by an RL agent"
readme = "README.md"
authors = [
    { name = "raymogg", email = "raymondmogg@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jax>=0.6.2",
    "numpy>=1.24",
    "optax>=0.2.8",
    "tomli>=2 ; python_full_version < '3.11'",
]

[project.scripts]
foragers-world-rl = "foragers_world_rl.agent:main"
foragers-ppo = "foragers_world_rl.ppo:main"
foragers-experiment = "foragers_world_rl.experiments:main"
foragers-plots = "foragers_world_rl.plots:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
plots = [
    "matplotlib>=3.10.9",
]
